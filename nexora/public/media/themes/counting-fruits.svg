<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Sky & Landscape -->
  <rect width="400" height="240" rx="20" fill="url(#bgSky)"/>
  
  <!-- Sun & Clouds -->
  <circle cx="340" cy="50" r="30" fill="#FDE047" opacity="0.9"/>
  <ellipse cx="80" cy="50" rx="35" ry="18" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="105" cy="45" rx="25" ry="16" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="60" cy="52" rx="20" ry="14" fill="#FFFFFF" opacity="0.8"/>

  <!-- Grass Hills -->
  <path d="M0 160 Q100 130 200 150 Q300 170 400 140 L400 240 L0 240 Z" fill="url(#grassGrad)"/>

  <!-- Fruit Basket 1 -->
  <g transform="translate(60, 110)">
    <!-- Woven Basket -->
    <path d="M10 40 L20 85 L90 85 L100 40 Z" fill="url(#basketGrad)" stroke="#B45309" stroke-width="3"/>
    <path d="M15 45 Q55 10 95 45" fill="none" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
    <!-- Apples inside -->
    <circle cx="35" cy="35" r="16" fill="url(#appleGrad)" stroke="#991B1B" stroke-width="2"/>
    <circle cx="60" cy="30" r="16" fill="url(#appleGrad)" stroke="#991B1B" stroke-width="2"/>
    <circle cx="75" cy="38" r="16" fill="url(#appleGrad)" stroke="#991B1B" stroke-width="2"/>
    <circle cx="48" cy="45" r="16" fill="url(#appleGrad)" stroke="#991B1B" stroke-width="2"/>
    <!-- Leaf -->
    <path d="M60 14 Q65 6 72 10 Q68 18 60 14" fill="#15803D"/>
  </g>

  <!-- Central Highlight Apple -->
  <g transform="translate(190, 100)">
    <!-- Big Shiny Apple -->
    <circle cx="30" cy="45" r="32" fill="url(#appleGrad)" stroke="#991B1B" stroke-width="3"/>
    <ellipse cx="20" cy="32" rx="8" ry="14" fill="#FFFFFF" opacity="0.4" transform="rotate(-30 20 32)"/>
    <!-- Stem & Leaf -->
    <path d="M30 15 Q33 5 36 2" fill="none" stroke="#78350F" stroke-width="4" stroke-linecap="round"/>
    <path d="M36 8 Q48 2 52 10 Q45 18 36 8" fill="#22C55E"/>
    <!-- Cute Happy Face on Apple -->
    <circle cx="20" cy="45" r="4" fill="#0F172A"/>
    <circle cx="40" cy="45" r="4" fill="#0F172A"/>
    <path d="M24 54 Q30 60 36 54" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="14" cy="50" r="4" fill="#FCA5A5"/>
    <circle cx="46" cy="50" r="4" fill="#FCA5A5"/>
  </g>

  <!-- Fruit Basket 2 -->
  <g transform="translate(260, 110)">
    <path d="M10 40 L20 85 L90 85 L100 40 Z" fill="url(#basketGrad)" stroke="#B45309" stroke-width="3"/>
    <path d="M15 45 Q55 10 95 45" fill="none" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
    <circle cx="35" cy="35" r="16" fill="url(#appleGrad)" stroke="#991B1B" stroke-width="2"/>
    <circle cx="60" cy="30" r="16" fill="url(#appleGrad)" stroke="#991B1B" stroke-width="2"/>
    <circle cx="75" cy="38" r="16" fill="url(#appleGrad)" stroke="#991B1B" stroke-width="2"/>
    <circle cx="48" cy="45" r="16" fill="url(#appleGrad)" stroke="#991B1B" stroke-width="2"/>
    <path d="M60 14 Q65 6 72 10 Q68 18 60 14" fill="#15803D"/>
  </g>
</svg>
