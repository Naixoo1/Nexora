<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="spaceDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="rocketTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="planetRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="20" fill="url(#spaceDark)"/>

  <!-- Stars & Galaxies -->
  <circle cx="40" cy="40" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="120" cy="25" r="2.5" fill="#FDE047" opacity="0.9"/>
  <circle cx="200" cy="45" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="360" cy="30" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="30" cy="180" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="160" cy="200" r="2" fill="#FDE047" opacity="0.7"/>
  <circle cx="370" cy="190" r="2.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Ringed Planet -->
  <g transform="translate(290, 80)">
    <!-- Back of Ring -->
    <ellipse cx="40" cy="40" rx="55" ry="16" fill="none" stroke="#FDE047" stroke-width="6" opacity="0.6" transform="rotate(-20 40 40)"/>
    <!-- Planet Sphere -->
    <circle cx="40" cy="40" r="30" fill="url(#planetRing)" stroke="#1E1B4B" stroke-width="2"/>
    <!-- Front of Ring -->
    <path d="M-12 58 C10 75 70 55 92 22" fill="none" stroke="#FDE047" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Cute Rocket Ship -->
  <g transform="translate(110, 60) rotate(35 60 60)">
    <!-- Fire Booster Exhaust -->
    <path d="M45 110 Q60 150 75 110 Z" fill="url(#flameGrad)"/>
    <path d="M50 110 Q60 135 70 110 Z" fill="#FEF08A"/>

    <!-- Fins (Wings) -->
    <polygon points="35,80 20,110 45,100" fill="url(#rocketTip)"/>
    <polygon points="85,80 100,110 75,100" fill="url(#rocketTip)"/>

    <!-- Rocket Fuselage -->
    <path d="M40 50 Q60 10 80 50 L80 105 L40 105 Z" fill="url(#rocketBody)" stroke="#0F172A" stroke-width="3"/>

    <!-- Red Nose Cone -->
    <path d="M40 50 Q60 10 80 50 Z" fill="url(#rocketTip)"/>

    <!-- Porthole Window with Smiling Astronaut Visor -->
    <circle cx="60" cy="68" r="14" fill="#0284C7" stroke="#0F172A" stroke-width="3"/>
    <ellipse cx="56" cy="64" rx="4" ry="7" fill="#FFFFFF" opacity="0.6" transform="rotate(-30 56 64)"/>
  </g>
</svg>
