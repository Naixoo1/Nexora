<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="loseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="160" cy="160" r="140" fill="url(#loseGlow)" />

  <!-- Encouraging Mascot Head -->
  <circle cx="160" cy="140" r="65" fill="url(#bodyGrad)" stroke="#0369A1" stroke-width="4"/>

  <!-- Cheerful / Determined Mascot Eyes -->
  <ellipse cx="140" cy="130" rx="9" ry="12" fill="#0F172A"/>
  <circle cx="137" cy="126" r="3.5" fill="#FFFFFF"/>
  <ellipse cx="180" cy="130" rx="9" ry="12" fill="#0F172A"/>
  <circle cx="177" cy="126" r="3.5" fill="#FFFFFF"/>

  <!-- Determined Smile with Tongue -->
  <path d="M142 155 Q160 175 178 155" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>

  <!-- Cute Rosy Cheeks -->
  <circle cx="125" cy="145" r="9" fill="#FDA4AF" opacity="0.8"/>
  <circle cx="195" cy="145" r="9" fill="#FDA4AF" opacity="0.8"/>

  <!-- Flexing Bicep Arms (Left & Right) -->
  <!-- Left Arm -->
  <path d="M100 155 Q60 140 70 105 Q85 105 95 125" fill="url(#bodyGrad)" stroke="#0369A1" stroke-width="4"/>
  <circle cx="72" cy="108" r="12" fill="#38BDF8" stroke="#0369A1" stroke-width="3"/>

  <!-- Right Arm -->
  <path d="M220 155 Q260 140 250 105 Q235 105 225 125" fill="url(#bodyGrad)" stroke="#0369A1" stroke-width="4"/>
  <circle cx="248" cy="108" r="12" fill="#38BDF8" stroke="#0369A1" stroke-width="3"/>

  <!-- Encouraging Sparkles & Heart -->
  <path d="M160 45 C150 30 130 35 130 50 C130 65 160 85 160 85 C160 85 190 65 190 50 C190 35 170 30 160 45 Z" fill="url(#muscleGrad)"/>
  
  <polygon points="90,45 92,51 98,52 94,56 95,62 90,59 85,62 86,56 82,52 88,51" fill="#FBBF24" />
  <polygon points="230,45 232,51 238,52 234,56 235,62 230,59 225,62 226,56 222,52 228,51" fill="#FBBF24" />

  <!-- Motivational Banner Base -->
  <rect x="90" y="225" width="140" height="34" rx="17" fill="#1E293B" stroke="#6366F1" stroke-width="2" />
  <text x="160" y="247" text-anchor="middle" fill="#A5B4FC" font-family="sans-serif" font-weight="bold" font-size="13">AYO COBA LAGI!</text>
</svg>
